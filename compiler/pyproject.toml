[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ink-studio-compiler"
version = "1.0.0"
description = "Prepare painted images and animated ink contours locally."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
ink-image = "ink_studio_compiler.ink_image:cli"

[project.urls]
Source = "https://github.com/sanjayb-28/ink-studio"

[tool.setuptools]
packages = ["ink_studio_compiler"]
package-dir = {ink_studio_compiler = "."}
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-cpu.txt"]}
